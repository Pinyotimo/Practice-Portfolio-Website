<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{{site.title}}</title>
    <meta
      name="description"
      content="{{site.description}}"
    />
    <meta name="author" content="{{site.name}}" />
    <meta name="theme-color" content="{{theme.defaultMeta}}" />
    <link rel="canonical" href="{{site.url}}" />

    <!-- Open Graph / social preview. {{site.*}} tokens are filled from
         SITE in src/data/portfolio.js at build time (vite.config.js). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{site.name}}" />
    <meta property="og:title" content="{{site.ogTitle}}" />
    <meta
      property="og:description"
      content="{{site.description}}"
    />
    <meta property="og:url" content="{{site.url}}" />
    <meta property="og:image" content="{{site.ogImage}}" />
    <meta property="og:image:alt" content="Portrait of {{site.name}}" />
    <!-- The portrait is square, so the compact card shows it uncropped. -->
    <meta name="twitter:card" content="summary" />

    <script type="application/ld+json">{{site.jsonLd}}</script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <script>
      /* Stamp the theme before first paint so the page never flashes the
         wrong background. The id → mode map is filled in from
         src/theme/themes.js at build time (vite.config.js). */
      (function () {
        try {
          var modes = {{theme.modes}};
          var stored = localStorage.getItem('st-theme');
          var theme = modes[stored]
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = modes[theme];
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui, sans-serif">
        This portfolio uses JavaScript for the interactive sections. The written
        content is still available by scrolling — please enable JavaScript for
        the full experience.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
