<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Sent | Stephen Oduor</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(180deg, #07111f 0%, #030814 100%);
            color: #f3f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }
        .card {
            max-width: 480px;
            padding: 48px 40px;
            background: rgba(10, 21, 41, 0.78);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 32px;
        }
        .icon {
            width: 64px; height: 64px;
            margin: 0 auto 24px;
            border-radius: 50%;
            background: rgba(73, 220, 177, 0.12);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem;
            color: #49dcb1;
        }
        h1 { font-size: 1.8rem; margin-bottom: 12px; }
        p  { color: #a6b4c8; line-height: 1.75; margin-bottom: 32px; }
        a {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 14px 28px;
            border-radius: 999px;
            background: linear-gradient(135deg, #49dcb1, #1fa2ff);
            color: #02111c;
            text-decoration: none;
            font-weight: 700;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 14px 32px rgba(31,162,255,.22);
        }
        a:hover { transform: translateY(-3px); box-shadow: 0 18px 38px rgba(31,162,255,.30); }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">✓</div>
        <h1>Message Sent!</h1>
        <p>Thanks for reaching out. I'll get back to you as soon as possible.</p>
        <a href="https://stephen-oduor-portfolio-website.vercel.app">← Back to Portfolio</a>
    </div>
</body>
</html>
